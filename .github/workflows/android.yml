name: Build Road Legends APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract game project
        run: unzip RoadLegendsAndroid_Project.zip -d .

      - name: Build APK
        run: gradle -p RoadLegendsAndroid :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Road-Legends-APK
          path: RoadLegendsAndroid/app/build/outputs/apk/debug/app-debug.apk
